<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>README Grader — Score Your Open Source README</title>
<meta name="description" content="Free tool to grade your GitHub README. Get instant feedback on structure, clarity, and completeness.">
<style>
:root{--bg:#0a0a0f;--surface:#14141f;--surface2:#1e1e2e;--border:#2a2a3e;--text:#e0e0f0;--muted:#8888aa;--accent:#06b6d4;--accent2:#22d3ee;--green:#22c55e;--yellow:#eab308;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.container{max-width:860px;margin:0 auto;padding:2rem 1.5rem}
header{text-align:center;margin-bottom:2.5rem}
h1{font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2),#67e8f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
header p{color:var(--muted);font-size:1.05rem}
.input-section{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.5rem}
.input-section label{display:block;font-weight:600;margin-bottom:.5rem;font-size:.9rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.input-section textarea{width:100%;min-height:280px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1rem;color:var(--text);font-size:.9rem;font-family:'SF Mono',Monaco,Consolas,monospace;line-height:1.5;resize:vertical;outline:none;tab-size:2;transition:border-color .2s}
.input-section textarea:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:.5rem;background:linear-gradient(135deg,var(--accent),#0891b2);color:white;border:none;border-radius:10px;padding:.85rem 2rem;font-size:1rem;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s;width:100%;justify-content:center;margin-top:.5rem}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(6,182,212,.3)}
.btn:active{transform:translateY(0)}
.results{display:none;margin-top:2rem}
.results.visible{display:block}
.overall-score{text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2rem;margin-bottom:1.5rem}
.score-big{font-size:4rem;font-weight:800;margin-bottom:.25rem}
.score-grade{font-size:1.4rem;font-weight:700;margin-bottom:.25rem}
.score-sub{color:var(--muted);font-size:.9rem}
.checklist{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.5rem}
.checklist h3{font-size:1.1rem;margin-bottom:1rem}
.check-item{display:flex;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--border);align-items:flex-start}
.check-item:last-child{border-bottom:none}
.check-icon{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;margin-top:2px}
.check-pass{background:#22c55e30;color:var(--green)}
.check-fail{background:#ef444430;color:var(--red)}
.check-warn{background:#eab30830;color:var(--yellow)}
.check-text{font-size:.9rem;line-height:1.5}
.check-label{font-weight:600}
.dimension-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem}
@media(max-width:600px){.dimension-grid{grid-template-columns:1fr}h1{font-size:1.6rem}}
.dim-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem}
.dim-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}
.dim-name{font-weight:600;font-size:.95rem}
.dim-score{font-weight:700;font-size:1.1rem;padding:.15rem .6rem;border-radius:6px}
.dim-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:.6rem}
.dim-fill{height:100%;border-radius:3px;transition:width .6s ease}
.dim-tip{font-size:.85rem;color:var(--muted);line-height:1.5}
.ad-slot{max-width:860px;margin:1.5rem auto;padding:0 1.5rem}
.ad-slot>div{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;text-align:center;min-height:90px;display:flex;align-items:center;justify-content:center}
footer{text-align:center;padding:2rem 0;color:var(--muted);font-size:.8rem}
footer a{color:var(--accent2);text-decoration:none}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>README Grader</h1>
    <p>Paste your README.md. Get an instant grade with specific fixes.</p>
  </header>
  <div class="input-section">
    <label>Your README.md</label>
    <textarea id="readme" placeholder="# My Project&#10;&#10;Paste your full README.md here..."></textarea>
    <button class="btn" onclick="grade()">📋 Grade My README</button>
  </div>
  <div class="results" id="results">
    <div class="overall-score" id="overall"></div>
    <div class="dimension-grid" id="dims"></div>
    <div class="checklist" id="checklist"></div>
  </div>
</div>
<div class="ad-slot">
  <div>
    <script async type="text/javascript" src="//cdn.carbonads.com/carbon.js?serve=CWYDP27Y&placement=michael-ami-01githubio" id="_carbonads_js"></script>
    <noscript><span style="color:var(--muted);font-size:.85rem">Ad slot — <a href="mailto:michael_ami_01@yahoo.com" style="color:var(--accent2)">sponsor this tool</a></span></noscript>
  </div>
</div>
<footer>
  Built by <a href="https://github.com/mzio" target="_blank">Michael Zhang</a> ·
  <a href="https://michael-ami-01.github.io/cold-email-scorer" target="_blank">Cold Email Scorer</a>
</footer>
<script>
function grade(){
  const md=document.getElementById('readme').value.trim();
  if(!md){alert('Paste a README to grade.');return}
  const r=analyze(md);
  render(r);
}
function analyze(md){
  const lines=md.split('\n');
  const wc=md.split(/\s+/).filter(Boolean).length;
  const checks=[];
  const dims=[];

  // --- Checks ---
  const hasTitle=/^#\s+\S/m.test(md);
  checks.push({name:'Project title',pass:hasTitle,tip:hasTitle?'Has a clear H1 title.':'Missing an H1 title. Start with # Project Name.'});

  const hasDesc=wc>15&&/^[^#\n].{20,}/m.test(md);
  checks.push({name:'Description',pass:hasDesc,tip:hasDesc?'Has a substantive description.':'Add a 1-2 sentence description right after the title explaining what this does and why someone would use it.'});

  const hasInstall=/install|getting started|setup|quick start|npm i|pip install|brew install|cargo install|go get|git clone/i.test(md);
  checks.push({name:'Installation',pass:hasInstall,tip:hasInstall?'Installation/setup instructions found.':'Add installation instructions. Show the exact commands to get started.'});

  const hasUsage=/usage|example|how to|getting started|demo|tutorial/i.test(md);
  const hasCodeBlock=/```[\s\S]*?```|`[^`]+`/m.test(md);
  checks.push({name:'Usage examples',pass:hasUsage||hasCodeBlock,tip:(hasUsage||hasCodeBlock)?'Usage section or code examples found.':'Add a Usage section with code examples showing the most common use case.'});

  const hasLicense=/license|mit|apache|gpl|bsd|isc|mpl/i.test(md);
  checks.push({name:'License',pass:hasLicense,tip:hasLicense?'License mentioned.':'Mention your license. No license = no one can legally use your code.'});

  const hasBadges=/\!\[.*?\]\(.*?(badge|shield|img\.shields|travis|circleci|codecov|npm|pypi|crates).*?\)/i.test(md);
  checks.push({name:'Badges',pass:hasBadges,warn:!hasBadges,tip:hasBadges?'Has status badges.':'Consider adding badges (build status, npm version, coverage). They signal project health at a glance.'});

  const hasContrib=/contribut|pull request|pr|issue|fork/i.test(md);
  checks.push({name:'Contributing',pass:hasContrib,warn:!hasContrib,tip:hasContrib?'Contributing guidelines present.':'Add a Contributing section if you want community help.'});

  const hasAPI=/api|reference|parameter|argument|option|flag|method|function|class|interface|endpoint/i.test(md);
  checks.push({name:'API / Reference',pass:hasAPI,warn:!hasAPI,tip:hasAPI?'API or reference docs found.':'For libraries/tools, add API reference docs. Even a brief parameter table helps.'});

  const hasScreenshot=/\!\[.*?\]\(.*?\.(png|jpg|gif|svg|webp)/i.test(md)||/screenshot|demo|preview/i.test(md);
  checks.push({name:'Visuals',pass:hasScreenshot,warn:!hasScreenshot,tip:hasScreenshot?'Visual content (screenshots/demos) found.':'Add a screenshot or GIF. Visual proof is the fastest way to hook someone.'});

  const hasTOC=/table of contents|## contents|## toc|\]\(#/i.test(md);
  const needsTOC=wc>500;
  if(needsTOC){
    checks.push({name:'Table of Contents',pass:hasTOC,warn:!hasTOC,tip:hasTOC?'TOC found for long README.':'Your README is long. Add a Table of Contents for navigation.'});
  }

  // --- Dimensions ---
  // 1. Structure
  const headingCount=(md.match(/^#{1,3}\s+\S/gm)||[]).length;
  let structScore=Math.min(10,headingCount*1.5+2);
  if(!hasTitle)structScore-=3;
  if(headingCount<2)structScore=Math.max(2,structScore-2);
  if(headingCount>15)structScore-=2;
  structScore=Math.max(1,Math.min(10,Math.round(structScore)));
  dims.push({name:'Structure',score:structScore,tip:structScore>=7?'Well-organized with clear sections.':structScore>=4?'Needs more sections. Break content into headed sections (## Installation, ## Usage, etc.).':'Minimal structure. Add H2 headings to organize your README into scannable sections.'});

  // 2. Completeness
  const essentials=[hasTitle,hasDesc,hasInstall,hasUsage||hasCodeBlock,hasLicense];
  const essentialScore=essentials.filter(Boolean).length;
  let complScore=Math.round(essentialScore*2);
  if(hasBadges)complScore++;
  if(hasContrib)complScore++;
  complScore=Math.max(1,Math.min(10,complScore));
  dims.push({name:'Completeness',score:complScore,tip:complScore>=7?'Covers the essential sections well.':complScore>=4?'Missing some key sections. A great README has: title, description, install, usage, and license at minimum.':'Missing most essential sections. Start with the basics: what is it, how to install, how to use.'});

  // 3. Clarity
  const codeBlocks=(md.match(/```[\s\S]*?```/g)||[]).length;
  const avgLineLen=lines.reduce((s,l)=>s+l.length,0)/Math.max(1,lines.length);
  let clarScore=7;
  if(codeBlocks>=2)clarScore+=1;
  if(codeBlocks>=4)clarScore+=1;
  if(avgLineLen>120)clarScore-=2;
  if(wc<20)clarScore-=3;
  const jargon=(md.match(/\b(utilize|leverage|synerg|paradigm|empower|holistic)\w*/gi)||[]).length;
  clarScore-=jargon;
  clarScore=Math.max(1,Math.min(10,Math.round(clarScore)));
  dims.push({name:'Clarity',score:clarScore,tip:clarScore>=7?'Clear writing with good code examples.':clarScore>=4?'Could use more code examples or shorter paragraphs.':'Hard to follow. Add more code blocks and break long paragraphs into shorter chunks.'});

  // 4. First Impression
  let firstImpression=5;
  if(hasTitle)firstImpression+=1;
  if(hasDesc)firstImpression+=1;
  if(hasBadges)firstImpression+=1;
  if(hasScreenshot)firstImpression+=1;
  if(wc>50)firstImpression+=1;
  if(wc<15)firstImpression-=2;
  firstImpression=Math.max(1,Math.min(10,firstImpression));
  dims.push({name:'First Impression',score:firstImpression,tip:firstImpression>=7?'Strong opening — title, description, and visual proof.':firstImpression>=4?'Decent start. Add a one-liner description and a screenshot/badge to hook visitors.':'Weak first impression. Visitors decide in 5 seconds — show them what it does immediately.'});

  // 5. SEO / Discoverability
  let seoScore=5;
  if(hasTitle)seoScore+=1;
  if(hasDesc)seoScore+=1;
  if(/keyword|tag|topic/i.test(md))seoScore+=1;
  if(hasBadges)seoScore+=1;
  if(hasLicense)seoScore+=1;
  if(wc>100)seoScore+=1;
  seoScore=Math.max(1,Math.min(10,seoScore));
  dims.push({name:'Discoverability',score:seoScore,tip:seoScore>=7?'Good discoverability signals for GitHub search.':seoScore>=4?'Add keywords naturally in description. Include what problem it solves.':'Low discoverability. Add a clear description with relevant keywords so people can find this.'});

  const overall=Math.round(dims.reduce((s,d)=>s+d.score,0)/dims.length*10);
  return {overall,dims,checks,wc,headingCount};
}
function c(s){return s>=8?'var(--green)':s>=5?'var(--yellow)':'var(--red)'}
function g(s){return s>=90?'A+':s>=80?'A':s>=70?'B+':s>=60?'B':s>=50?'C':s>=40?'D':'F'}
function render(r){
  const el=document.getElementById('results');
  el.classList.add('visible');
  const oc=c(r.overall/10);
  document.getElementById('overall').innerHTML=`
    <div class="score-big" style="color:${oc}">${r.overall}</div>
    <div class="score-grade" style="color:${oc}">Grade: ${g(r.overall)}</div>
    <div class="score-sub">${r.wc} words · ${r.headingCount} headings</div>`;
  document.getElementById('dims').innerHTML=r.dims.map(d=>{
    const dc=c(d.score);
    return `<div class="dim-card"><div class="dim-header"><span class="dim-name">${d.name}</span><span class="dim-score" style="color:${dc};background:${dc}20">${d.score}/10</span></div><div class="dim-bar"><div class="dim-fill" style="width:${d.score*10}%;background:${dc}"></div></div><div class="dim-tip">${d.tip}</div></div>`;
  }).join('');
  document.getElementById('checklist').innerHTML=`<h3>✅ Section Checklist</h3>`+r.checks.map(ch=>{
    const cls=ch.pass?'check-pass':ch.warn?'check-warn':'check-fail';
    const icon=ch.pass?'✓':ch.warn?'~':'✗';
    return `<div class="check-item"><div class="check-icon ${cls}">${icon}</div><div class="check-text"><span class="check-label">${ch.name}</span> — ${ch.tip}</div></div>`;
  }).join('');
  el.scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
</html>
